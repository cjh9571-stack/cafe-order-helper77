<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a2d55">
<title>카페 주문 도우미</title>
<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height:100%; overscroll-behavior:none; }
  body {
    font-family: 'Pretendard','Noto Sans KR',sans-serif;
    background:#0b1324; color:#e8eaf0;
    display:flex; flex-direction:column; height:100vh; height:100dvh; overflow:hidden;
  }

  #warnBanner {
    background:#7c2d12; color:#fed7aa; font-size:12px; padding:8px 12px; text-align:center;
  }

  #topbar {
    display:flex; flex-wrap:wrap; gap:6px; padding:10px 12px;
    background:#111e3a; border-bottom:1px solid #2d4a80;
  }
  #topbar h1 { width:100%; font-size:15px; font-weight:700; color:#fff; margin-bottom:6px; }
  .tbtn {
    flex:1 1 auto; min-width:70px; padding:9px 8px; border-radius:8px; border:1px solid #3a5a90;
    background:#1a2d55; color:#dbe6f8; font-size:12px; font-weight:600; cursor:pointer;
  }
  .tbtn:active { background:#274176; }
  .tbtn.danger { border-color:#7f1d1d; color:#fca5a5; }

  #stageWrap { flex:1; position:relative; overflow:auto; background:#0d1830; min-height:0; }
  #stage {
    position:relative; min-height:260px; width:100%;
    background:repeating-linear-gradient(45deg,#0f1c38,#0f1c38 10px,#101e3d 10px,#101e3d 20px);
  }
  #menuImgClip { position:relative; overflow:hidden; touch-action:none; }
  #menuImg { display:block; width:100%; height:auto; transform-origin:0 0; }
  #stagePlaceholder {
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:#5f7aa8; font-size:13px; text-align:center; padding:20px; pointer-events:none;
  }

  .face-card {
    position:absolute; width:64px; touch-action:none; cursor:grab; user-select:none;
    display:flex; flex-direction:column; align-items:center; z-index:5;
  }
  .face-card img, .card-generic {
    width:56px; height:56px; border-radius:50%; object-fit:cover;
    border:3px solid #6a9acd; background:#274176; display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:18px; color:#fff;
  }
  .card-generic { font-size:22px; }
  .face-card.selected img, .face-card.selected .card-generic { border-color:#fbbf24; box-shadow:0 0 0 3px rgba(251,191,36,.35); }
  .card-label {
    font-size:11px; color:#dbe6f8; margin-top:2px; background:#0b1324cc; padding:1px 6px; border-radius:8px;
    max-width:74px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .card-count {
    position:absolute; top:-4px; right:6px; background:#ef4444; color:#fff; font-size:11px;
    font-weight:700; min-width:18px; height:18px; border-radius:9px; display:flex; align-items:center; justify-content:center;
    padding:0 4px;
  }
  .card-del {
    position:absolute; top:-6px; left:2px; width:20px; height:20px; border-radius:50%;
    background:#1f2937; color:#fca5a5; border:1px solid #4b5563; font-size:13px; line-height:1;
    cursor:pointer;
  }

  /* 선택된 카드 패널 */
  #cardPanel {
    background:#141f3d; border-top:1px solid #2d4a80; padding:10px 14px 4px; flex-shrink:0;
  }
  #cardOrderList { max-height:150px; overflow-y:auto; margin-bottom:8px; }
  .order-empty { font-size:12px; color:#6b7280; padding:6px 2px; }
  .order-row {
    display:flex; align-items:center; gap:8px; padding:6px 4px; border-bottom:1px solid #1f2c4d; font-size:13px;
  }
  .order-menu { flex:1; color:#e8eaf0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .qty-btn {
    width:26px; height:26px; border-radius:6px; border:1px solid #3a5a90; background:#1a2d55;
    color:#dbe6f8; font-size:15px; line-height:1; cursor:pointer; flex-shrink:0;
  }
  .order-qty { min-width:18px; text-align:center; font-weight:700; flex-shrink:0; }
  .order-del {
    width:22px; height:22px; border-radius:50%; border:1px solid #4b5563; background:#1f2937;
    color:#fca5a5; font-size:12px; cursor:pointer; flex-shrink:0;
  }
  .manual-add-row { display:flex; gap:8px; margin-bottom:8px; }
  .manual-add-row input {
    flex:1; padding:8px 10px; border-radius:8px; border:1px solid #3a5a90; background:#111e3a;
    color:#e8eaf0; font-size:13px;
  }
  .manual-add-row button {
    padding:8px 14px; border-radius:8px; border:none; background:#3b82f6; color:#fff; font-size:13px; font-weight:700; cursor:pointer;
  }
  #cardNameInput {
    width:100%; padding:8px 10px; margin-bottom:10px; border-radius:8px; border:1px solid #3a5a90;
    background:#111e3a; color:#e8eaf0; font-size:13px;
  }

  #bottombar {
    display:flex; align-items:center; gap:12px; padding:10px 14px;
    background:#111e3a; border-top:1px solid #2d4a80; flex-shrink:0;
  }
  #micLabel { flex:1; font-size:12px; color:#9cb8d8; }
  #micBtn {
    width:64px; height:64px; border-radius:50%; border:none; background:#3b82f6; color:#fff;
    font-size:24px; flex-shrink:0; box-shadow:0 4px 14px rgba(59,130,246,.4);
  }
  #micBtn:disabled { background:#334155; box-shadow:none; color:#64748b; }
  #micBtn.listening { background:#ef4444; box-shadow:0 0 0 8px rgba(239,68,68,.25); }

  #loadingOverlay {
    position:fixed; inset:0; background:rgba(11,19,36,.85); display:flex; align-items:center;
    justify-content:center; color:#fff; font-size:14px; z-index:200;
  }

  .modal-backdrop {
    position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:flex-end;
    justify-content:center; z-index:150;
  }
  .modal-card {
    width:100%; max-width:480px; background:#1e2333; border-radius:16px 16px 0 0; padding:18px;
    border:1px solid #2a2f3e;
  }
  .modal-card h3 { font-size:15px; margin-bottom:10px; }
  .modal-raw { font-size:12px; color:#9ca3af; margin-bottom:12px; }
  .field-row { display:flex; gap:8px; margin-bottom:10px; }
  .field-row label { font-size:12px; color:#9ca3af; width:52px; flex-shrink:0; align-self:center; }
  .field-row input {
    flex:1; padding:9px 10px; border-radius:8px; border:1px solid #3a5a90; background:#111e3a;
    color:#e8eaf0; font-size:14px;
  }
  .modal-actions { display:flex; gap:8px; margin-top:12px; }
  .modal-actions button {
    flex:1; padding:11px; border-radius:8px; border:none; font-size:14px; font-weight:700; cursor:pointer;
  }
  #modalCancelBtn { background:#334155; color:#cbd5e1; }
  #modalConfirmBtn { background:#3b82f6; color:#fff; }

  #statusPanel {
    position:fixed; inset:0; background:#0b1324; z-index:180; display:flex; flex-direction:column;
  }
  #statusHeader {
    display:flex; align-items:center; justify-content:space-between; padding:14px 16px;
    background:#111e3a; border-bottom:1px solid #2d4a80;
  }
  #statusHeader h2 { font-size:16px; }
  #statusHeader button { background:none; border:none; color:#9cb8d8; font-size:20px; }
  #statusContent { flex:1; overflow-y:auto; padding:16px; }
  #statusContent h2 { font-size:14px; color:#a8c4e8; margin:14px 0 8px; }
  #statusContent h2:first-child { margin-top:0; }
  .total-list, .person-block ul { list-style:none; }
  .total-list li, .person-block li {
    display:flex; justify-content:space-between; padding:8px 10px; background:#141f3d; border-radius:8px;
    margin-bottom:6px; font-size:14px;
  }
  .grand-total { text-align:right; font-size:13px; color:#fbbf24; margin:6px 0 4px; }
  .person-block { margin-bottom:14px; padding:10px; background:#101c38; border-radius:10px; }
  .person-title { display:flex; align-items:center; gap:8px; font-size:13px; font-weight:700; color:#93c5fd; margin-bottom:8px; }
  .mini-avatar { width:26px; height:26px; border-radius:50%; object-fit:cover; background:#274176; flex-shrink:0; }
  #statusFooter { padding:12px 16px; border-top:1px solid #2d4a80; display:flex; gap:8px; }
  #statusFooter button {
    flex:1; padding:12px; border-radius:8px; border:none; font-size:14px; font-weight:700; cursor:pointer;
  }
  #copyBtn { background:#10b981; color:#fff; }
  #closeStatusBtn { background:#334155; color:#cbd5e1; }

  #toast {
    position:fixed; left:50%; bottom:100px; transform:translateX(-50%); background:#1e2333;
    border:1px solid #3a5a90; color:#e8eaf0; padding:10px 16px; border-radius:20px; font-size:13px;
    z-index:190; opacity:0; transition:opacity .2s; pointer-events:none;
  }
  #toast.show { opacity:1; }

  [hidden] { display:none !important; }
</style>
</head>
<body>

<div id="warnBanner" hidden></div>

<div id="topbar">
  <h1>☕ 카페 주문 도우미</h1>
  <button class="tbtn" id="menuPhotoBtn">📋 메뉴판 촬영</button>
  <button class="tbtn" id="groupPhotoBtn">🧑‍🤝‍🧑 인원 촬영</button>
  <button class="tbtn" id="addCardBtn">➕ 인물 추가</button>
  <button class="tbtn" id="statusBtn">📊 현황</button>
  <button class="tbtn" id="orderResetBtn">🔄 주문 초기화</button>
  <button class="tbtn danger" id="resetBtn">🗑️ 전체 초기화</button>
  <input type="file" id="menuPhotoInput" accept="image/*" capture="environment" hidden>
  <input type="file" id="groupPhotoInput" accept="image/*" capture="environment" hidden>
</div>

<div id="stageWrap">
  <div id="stage">
    <div id="menuImgClip">
      <img id="menuImg" hidden>
    </div>
    <div id="stagePlaceholder">메뉴판을 촬영하고, 인원 사진을 찍으면<br>여기에 얼굴카드가 표시돼요.<br>카드를 눌러 선택한 뒤 마이크를 눌러 메뉴를 말하세요.</div>
  </div>
</div>

<div id="cardPanel" hidden>
  <div id="cardOrderList"></div>
  <div class="manual-add-row">
    <input type="text" id="manualMenuInput" placeholder="메뉴 이름 직접 추가">
    <button id="manualAddBtn" type="button">추가</button>
  </div>
  <input type="text" id="cardNameInput" placeholder="이름 입력 (선택)">
</div>

<div id="bottombar">
  <span id="micLabel">카드를 선택하세요</span>
  <button id="micBtn" disabled>🎙️</button>
</div>

<div id="loadingOverlay" hidden>얼굴 인식 중...</div>

<div class="modal-backdrop" id="confirmModal" hidden>
  <div class="modal-card">
    <h3>주문 확인</h3>
    <div class="modal-raw" id="modalRaw"></div>
    <div class="field-row">
      <label>메뉴</label>
      <input type="text" id="modalMenuInput">
    </div>
    <div class="field-row">
      <label>수량</label>
      <input type="number" id="modalQtyInput" min="1">
    </div>
    <div class="modal-actions">
      <button id="modalCancelBtn">취소</button>
      <button id="modalConfirmBtn">확정</button>
    </div>
  </div>
</div>

<div id="statusPanel" hidden>
  <div id="statusHeader">
    <h2>주문 현황</h2>
    <button id="closeStatusBtnTop">✕</button>
  </div>
  <div id="statusContent"></div>
  <div id="statusFooter">
    <button id="closeStatusBtn">닫기</button>
    <button id="copyBtn">텍스트로 복사</button>
  </div>
</div>

<div id="toast"></div>

<script>
// ══════════════════════════════════════════
//  상태
// ══════════════════════════════════════════
let cards = []; // { uid, el, orderMap:{menu:qty}, name, thumbSrc, displayLabel }
let cardCounter = 0;
let selectedCardId = null; // uid
let modelsLoaded = false;
let lastSummaryText = '';

const CARDS_PER_ROW = 4;
const CARD_ROW_HEIGHT = 78;
const CARD_AREA_BASE_TOP = 10;

const stage = document.getElementById('stage');
const menuImgClip = document.getElementById('menuImgClip');
const menuImg = document.getElementById('menuImg');
const stagePlaceholder = document.getElementById('stagePlaceholder');
const micBtn = document.getElementById('micBtn');
const micLabel = document.getElementById('micLabel');
const loadingOverlay = document.getElementById('loadingOverlay');
const cardPanel = document.getElementById('cardPanel');
const cardOrderList = document.getElementById('cardOrderList');
const cardNameInput = document.getElementById('cardNameInput');
const manualMenuInput = document.getElementById('manualMenuInput');

// ══════════════════════════════════════════
//  유틸
// ══════════════════════════════════════════
function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, ch => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[ch]));
}

function cardLabelText(card) {
  return card.name ? card.name : `${card.displayLabel}번`;
}

// ══════════════════════════════════════════
//  브라우저 지원 체크
// ══════════════════════════════════════════
window.addEventListener('DOMContentLoaded', () => {
  const banner = document.getElementById('warnBanner');
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    banner.hidden = false;
    banner.textContent = '⚠️ 이 브라우저는 음성인식을 지원하지 않습니다. 갤럭시의 Chrome 브라우저로 열어주세요.';
  } else if (location.protocol !== 'https:' && location.hostname !== 'localhost') {
    banner.hidden = false;
    banner.textContent = '⚠️ 음성인식은 https 주소에서만 동작합니다. GitHub Pages 등에 올려서 https:// 주소로 접속해주세요.';
  }
});

// 페이지 로드 시 마이크 권한을 한 번 미리 요청해서 크롬에 "허용"을 정식으로 저장시킴
// (음성인식 버튼을 누를 때마다 권한을 다시 묻는 것을 줄이기 위한 조치)
(async function warmupMicPermission() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    stream.getTracks().forEach(t => t.stop());
  } catch (err) {
    console.warn('mic warmup failed', err);
  }
})();

// ══════════════════════════════════════════
//  토스트
// ══════════════════════════════════════════
let toastTimer = null;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
}

// ══════════════════════════════════════════
//  메뉴판 사진
// ══════════════════════════════════════════
document.getElementById('menuPhotoBtn').addEventListener('click', () => {
  document.getElementById('menuPhotoInput').click();
});
document.getElementById('menuPhotoInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  menuImg.src = URL.createObjectURL(file);
  menuImg.hidden = false;
  stagePlaceholder.hidden = true;
  e.target.value = '';
});
menuImg.addEventListener('load', () => {
  resetImgZoom();
  updateStageMinHeight();
});

// 인물카드는 항상 메뉴판 위쪽에 배치되고, 카드 줄 수가 늘어나면 메뉴판을 그만큼 아래로 밀어냄
function updateCardAreaLayout() {
  const rowCount = cards.length > 0 ? Math.ceil(cards.length / CARDS_PER_ROW) : 0;
  const areaHeight = rowCount > 0 ? CARD_AREA_BASE_TOP + rowCount * CARD_ROW_HEIGHT + 10 : 0;
  stage.style.paddingTop = areaHeight + 'px';
}

function updateStageMinHeight() {
  let maxBottom = 0;
  cards.forEach(c => {
    const top = parseFloat(c.el.style.top) || 0;
    maxBottom = Math.max(maxBottom, top + 90);
  });
  stage.style.minHeight = Math.max(260, maxBottom + 20) + 'px';
}

// ══════════════════════════════════════════
//  메뉴판 확대/축소 (핀치 줌 + 더블탭, 카드와는 별개로 이미지만 확대)
// ══════════════════════════════════════════
let imgScale = 1, imgTranslateX = 0, imgTranslateY = 0;
const MIN_SCALE = 1, MAX_SCALE = 4;
const activeImgPointers = new Map();
let pinchStartDist = 0, pinchStartScale = 1;
let imgPanStart = null;
let lastTapTime = 0;

function applyImgTransform() {
  menuImg.style.transform = `translate(${imgTranslateX}px, ${imgTranslateY}px) scale(${imgScale})`;
}

function resetImgZoom() {
  imgScale = 1; imgTranslateX = 0; imgTranslateY = 0;
  applyImgTransform();
}

function clampImgPan() {
  const w = menuImgClip.clientWidth, h = menuImgClip.clientHeight;
  const maxX = (w * (imgScale - 1)) / 2 + 40;
  const maxY = (h * (imgScale - 1)) / 2 + 40;
  imgTranslateX = Math.max(-maxX, Math.min(maxX, imgTranslateX));
  imgTranslateY = Math.max(-maxY, Math.min(maxY, imgTranslateY));
}

menuImgClip.addEventListener('pointerdown', (e) => {
  menuImgClip.setPointerCapture(e.pointerId);
  activeImgPointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (activeImgPointers.size === 2) {
    const pts = [...activeImgPointers.values()];
    pinchStartDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    pinchStartScale = imgScale;
    imgPanStart = null;
  } else if (activeImgPointers.size === 1) {
    imgPanStart = { x: e.clientX, y: e.clientY, tx: imgTranslateX, ty: imgTranslateY };
  }
});

menuImgClip.addEventListener('pointermove', (e) => {
  if (!activeImgPointers.has(e.pointerId)) return;
  activeImgPointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (activeImgPointers.size === 2) {
    const pts = [...activeImgPointers.values()];
    const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    if (pinchStartDist > 0) {
      imgScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, pinchStartScale * (dist / pinchStartDist)));
      clampImgPan();
      applyImgTransform();
    }
  } else if (activeImgPointers.size === 1 && imgPanStart && imgScale > 1) {
    imgTranslateX = imgPanStart.tx + (e.clientX - imgPanStart.x);
    imgTranslateY = imgPanStart.ty + (e.clientY - imgPanStart.y);
    clampImgPan();
    applyImgTransform();
  }
});

function endImgPointer(e) {
  activeImgPointers.delete(e.pointerId);
  if (activeImgPointers.size === 1) {
    const p = [...activeImgPointers.values()][0];
    imgPanStart = { x: p.x, y: p.y, tx: imgTranslateX, ty: imgTranslateY };
  } else {
    imgPanStart = null;
    pinchStartDist = 0;
  }
}
menuImgClip.addEventListener('pointerup', endImgPointer);
menuImgClip.addEventListener('pointercancel', endImgPointer);

menuImgClip.addEventListener('pointerup', (e) => {
  if (activeImgPointers.size > 0) return;
  const now = Date.now();
  if (now - lastTapTime < 300) {
    lastTapTime = 0;
    if (imgScale > 1) {
      imgScale = 1; imgTranslateX = 0; imgTranslateY = 0;
    } else {
      imgScale = 2; imgTranslateX = 0; imgTranslateY = 0;
    }
    applyImgTransform();
  } else {
    lastTapTime = now;
  }
});

// ══════════════════════════════════════════
//  얼굴 인식 모델
// ══════════════════════════════════════════
async function ensureModelsLoaded() {
  if (modelsLoaded) return;
  const MODEL_URL = 'https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights';
  await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
  modelsLoaded = true;
}

function loadImageFromFile(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}

function cropFaceThumbnail(img, box) {
  const pad = box.width * 0.3;
  const sx = Math.max(0, box.x - pad);
  const sy = Math.max(0, box.y - pad);
  const sw = Math.min(img.naturalWidth - sx, box.width + pad * 2);
  const sh = Math.min(img.naturalHeight - sy, box.height + pad * 2);
  const size = 112;
  const canvas = document.createElement('canvas');
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, sx, sy, sw, sh, 0, 0, size, size);
  return canvas.toDataURL('image/png');
}

document.getElementById('groupPhotoBtn').addEventListener('click', () => {
  document.getElementById('groupPhotoInput').click();
});
document.getElementById('groupPhotoInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  loadingOverlay.hidden = false;
  try {
    const img = await loadImageFromFile(file);
    await ensureModelsLoaded();
    const detections = await faceapi.detectAllFaces(img, new faceapi.TinyFaceDetectorOptions({ inputSize: 320, scoreThreshold: 0.5 }));
    if (detections.length === 0) {
      toast('얼굴을 찾지 못했어요. 인물 추가로 직접 만들어주세요.');
    } else {
      detections.forEach(d => addCard(cropFaceThumbnail(img, d.box)));
      toast(`얼굴 ${detections.length}명 인식됨`);
    }
  } catch (err) {
    console.error(err);
    toast('얼굴 인식에 실패했어요. 인물 추가로 직접 만들어주세요.');
  } finally {
    loadingOverlay.hidden = true;
  }
});

// ══════════════════════════════════════════
//  얼굴카드
// ══════════════════════════════════════════
document.getElementById('addCardBtn').addEventListener('click', () => addCard(null));

function addCard(thumbSrc) {
  cardCounter++;
  const uid = cardCounter;

  const el = document.createElement('div');
  el.className = 'face-card';
  el.innerHTML = `
    <button class="card-del" type="button">×</button>
    <span class="card-count" hidden>0</span>
    ${thumbSrc ? `<img src="${thumbSrc}" alt="">` : `<div class="card-generic">👤</div>`}
    <div class="card-label"></div>
  `;
  stage.appendChild(el);
  stagePlaceholder.hidden = true;

  const card = { uid, el, orderMap: {}, name: '', thumbSrc, displayLabel: 0 };
  const idx = cards.length;
  const col = idx % CARDS_PER_ROW;
  const row = Math.floor(idx / CARDS_PER_ROW);
  el.style.left = (10 + col * 72) + 'px';
  el.style.top = (CARD_AREA_BASE_TOP + row * CARD_ROW_HEIGHT) + 'px';

  cards.push(card);
  makeDraggable(card);
  renumberCards();
  updateCardAreaLayout();
  updateStageMinHeight();

  el.querySelector('.card-del').addEventListener('pointerdown', (e) => e.stopPropagation());
  el.querySelector('.card-del').addEventListener('click', (e) => {
    e.stopPropagation();
    removeCard(uid);
  });

  return card;
}

function renumberCards() {
  cards.forEach((c, idx) => {
    c.displayLabel = idx + 1;
    c.el.querySelector('.card-label').textContent = cardLabelText(c);
  });
}

function removeCard(uid) {
  const idx = cards.findIndex(c => c.uid === uid);
  if (idx === -1) return;
  cards[idx].el.remove();
  cards.splice(idx, 1);
  renumberCards();
  updateCardAreaLayout();
  updateStageMinHeight();
  if (selectedCardId === uid) deselectCard();
}

function deselectCard() {
  if (selectedCardId === null) return;
  selectedCardId = null;
  cards.forEach(c => c.el.classList.remove('selected'));
  hideCardPanel();
  micBtn.disabled = true;
  micLabel.textContent = '카드를 선택하세요';
}

// 메뉴판이나 카드 옆 빈 공간을 누르면 열려있던 카드 패널을 닫음
stage.addEventListener('click', (e) => {
  if (e.target.closest('.face-card')) return;
  deselectCard();
});

function makeDraggable(card) {
  let dragging = false, moved = false, startX, startY, startLeft, startTop;
  card.el.addEventListener('pointerdown', (e) => {
    dragging = true; moved = false;
    startX = e.clientX; startY = e.clientY;
    const rect = card.el.getBoundingClientRect();
    const stageRect = stage.getBoundingClientRect();
    startLeft = rect.left - stageRect.left + stage.scrollLeft;
    startTop = rect.top - stageRect.top + stage.scrollTop;
    card.el.setPointerCapture(e.pointerId);
  });
  card.el.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const dx = e.clientX - startX, dy = e.clientY - startY;
    if (Math.abs(dx) > 6 || Math.abs(dy) > 6) moved = true;
    if (moved) {
      card.el.style.left = Math.max(0, startLeft + dx) + 'px';
      card.el.style.top = Math.max(0, startTop + dy) + 'px';
      updateStageMinHeight();
    }
  });
  card.el.addEventListener('pointerup', () => {
    dragging = false;
    if (!moved) selectCard(card.uid);
    else updateStageMinHeight();
  });
}

function selectCard(uid) {
  selectedCardId = uid;
  cards.forEach(c => c.el.classList.toggle('selected', c.uid === uid));
  const card = cards.find(c => c.uid === uid);
  micLabel.textContent = `${cardLabelText(card)} 선택됨 — 마이크를 눌러 말하기`;
  micBtn.disabled = false;
  showCardPanel(card);
}

// ══════════════════════════════════════════
//  선택된 카드 패널 (주문 내역 + 직접 추가 + 이름)
// ══════════════════════════════════════════
function showCardPanel(card) {
  cardPanel.hidden = false;
  cardNameInput.value = card.name || '';
  manualMenuInput.value = '';
  renderCardOrderList(card);
}

function hideCardPanel() {
  cardPanel.hidden = true;
}

function renderCardOrderList(card) {
  const entries = Object.entries(card.orderMap);
  if (entries.length === 0) {
    cardOrderList.innerHTML = '<div class="order-empty">아직 주문이 없습니다</div>';
    return;
  }
  cardOrderList.innerHTML = entries.map(([menu, qty]) => `
    <div class="order-row" data-menu="${escapeHtml(menu)}">
      <span class="order-menu">${escapeHtml(menu)}</span>
      <button class="qty-btn minus" type="button">−</button>
      <span class="order-qty">${qty}</span>
      <button class="qty-btn plus" type="button">+</button>
      <button class="order-del" type="button">×</button>
    </div>
  `).join('');
}

function updateCardBadge(card) {
  const total = Object.values(card.orderMap).reduce((s, q) => s + q, 0);
  const countEl = card.el.querySelector('.card-count');
  if (total > 0) { countEl.hidden = false; countEl.textContent = total; }
  else countEl.hidden = true;
}

cardOrderList.addEventListener('click', (e) => {
  const row = e.target.closest('.order-row');
  if (!row || selectedCardId === null) return;
  const menu = row.dataset.menu;
  const card = cards.find(c => c.uid === selectedCardId);
  if (!card) return;
  if (e.target.classList.contains('plus')) {
    card.orderMap[menu] = (card.orderMap[menu] || 0) + 1;
  } else if (e.target.classList.contains('minus')) {
    card.orderMap[menu] = (card.orderMap[menu] || 0) - 1;
    if (card.orderMap[menu] <= 0) delete card.orderMap[menu];
  } else if (e.target.classList.contains('order-del')) {
    delete card.orderMap[menu];
  } else {
    return;
  }
  renderCardOrderList(card);
  updateCardBadge(card);
});

document.getElementById('manualAddBtn').addEventListener('click', addManualMenu);
manualMenuInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') addManualMenu();
});
function addManualMenu() {
  const menu = manualMenuInput.value.trim();
  if (!menu || selectedCardId === null) return;
  const card = cards.find(c => c.uid === selectedCardId);
  if (!card) return;
  card.orderMap[menu] = (card.orderMap[menu] || 0) + 1;
  manualMenuInput.value = '';
  renderCardOrderList(card);
  updateCardBadge(card);
}

cardNameInput.addEventListener('input', () => {
  if (selectedCardId === null) return;
  const card = cards.find(c => c.uid === selectedCardId);
  if (!card) return;
  card.name = cardNameInput.value.trim();
  card.el.querySelector('.card-label').textContent = cardLabelText(card);
  micLabel.textContent = `${cardLabelText(card)} 선택됨 — 마이크를 눌러 말하기`;
});

// ══════════════════════════════════════════
//  음성 주문 (푸시투토크) — 인식 객체를 재사용해 권한 재요청을 줄임
// ══════════════════════════════════════════
const NUM_WORDS = {
  '한':1,'하나':1,'두':2,'둘':2,'세':3,'셋':3,'네':4,'넷':4,
  '다섯':5,'여섯':6,'일곱':7,'여덟':8,'아홉':9,'열':10
};

function parseOrderText(text) {
  text = text.trim();
  let qty = 1;
  let menu = text;

  const digitMatch = text.match(/(\d+)\s*(잔|개|컵)?/);
  if (digitMatch) {
    qty = parseInt(digitMatch[1], 10);
    menu = (text.slice(0, digitMatch.index) + text.slice(digitMatch.index + digitMatch[0].length)).trim();
  } else {
    for (const [word, num] of Object.entries(NUM_WORDS)) {
      const re = new RegExp(word + '\\s*(잔|개|컵)');
      const m = text.match(re);
      if (m) {
        qty = num;
        menu = (text.slice(0, m.index) + text.slice(m.index + m[0].length)).trim();
        break;
      }
    }
  }
  menu = menu.replace(/(주세요|해주세요|드릴게요|주시고|주시고요|줘요|줘|이고|이랑|입니다|요)$/,'').trim();
  if (!menu) menu = text.trim();
  return { menu, qty };
}

let recognition = null;
let recognitionActive = false;

function getRecognition() {
  if (recognition) return recognition;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return null;
  recognition = new SR();
  recognition.lang = 'ko-KR';
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  recognition.onresult = (ev) => {
    const text = ev.results[0][0].transcript;
    openConfirmModal(text);
  };
  recognition.onerror = (ev) => {
    console.warn('speech error', ev.error);
    if (ev.error === 'no-speech') toast('음성이 감지되지 않았어요');
    else if (ev.error === 'not-allowed') toast('마이크 권한을 허용해주세요');
  };
  recognition.onend = () => {
    recognitionActive = false;
    micBtn.classList.remove('listening');
    const card = cards.find(c => c.uid === selectedCardId);
    if (card) micLabel.textContent = `${cardLabelText(card)} 선택됨 — 마이크를 눌러 말하기`;
  };
  return recognition;
}

micBtn.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  if (selectedCardId === null) { toast('먼저 얼굴카드를 선택하세요'); return; }
  const r = getRecognition();
  if (!r) { toast('이 브라우저는 음성인식을 지원하지 않습니다'); return; }
  if (recognitionActive) return;

  micBtn.classList.add('listening');
  micLabel.textContent = '듣는 중...';
  recognitionActive = true;
  try {
    r.start();
  } catch (err) {
    console.warn(err);
    recognitionActive = false;
    micBtn.classList.remove('listening');
  }
});

function stopRecognition() {
  if (recognition && recognitionActive) {
    try { recognition.stop(); } catch (err) {}
  }
}
micBtn.addEventListener('pointerup', stopRecognition);
micBtn.addEventListener('pointercancel', stopRecognition);
micBtn.addEventListener('pointerleave', stopRecognition);

// ══════════════════════════════════════════
//  확인 모달
// ══════════════════════════════════════════
const confirmModal = document.getElementById('confirmModal');
const modalRaw = document.getElementById('modalRaw');
const modalMenuInput = document.getElementById('modalMenuInput');
const modalQtyInput = document.getElementById('modalQtyInput');

function openConfirmModal(rawText) {
  const parsed = parseOrderText(rawText);
  modalRaw.textContent = `인식된 문장: "${rawText}"`;
  modalMenuInput.value = parsed.menu;
  modalQtyInput.value = parsed.qty;
  confirmModal.hidden = false;
  modalMenuInput.focus();
}

document.getElementById('modalCancelBtn').addEventListener('click', () => {
  confirmModal.hidden = true;
});
document.getElementById('modalConfirmBtn').addEventListener('click', () => {
  const menu = modalMenuInput.value.trim();
  const qty = parseInt(modalQtyInput.value, 10) || 1;
  confirmModal.hidden = true;
  if (!menu || selectedCardId === null) return;
  addOrderToCard(selectedCardId, menu, qty);
});

function addOrderToCard(uid, menu, qty) {
  const card = cards.find(c => c.uid === uid);
  if (!card) return;
  card.orderMap[menu] = (card.orderMap[menu] || 0) + qty;
  updateCardBadge(card);
  if (selectedCardId === uid) renderCardOrderList(card);
  toast(`${menu} ${qty}개 추가됨 (${cardLabelText(card)})`);
}

// ══════════════════════════════════════════
//  현황판
// ══════════════════════════════════════════
const statusPanel = document.getElementById('statusPanel');
const statusContent = document.getElementById('statusContent');

function openStatusPanel() {
  const totalMap = {};
  cards.forEach(c => {
    Object.entries(c.orderMap).forEach(([menu, qty]) => {
      totalMap[menu] = (totalMap[menu] || 0) + qty;
    });
  });
  let totalCount = 0;
  Object.values(totalMap).forEach(v => totalCount += v);

  let html = '<h2>전체 합계</h2><ul class="total-list">';
  if (Object.keys(totalMap).length === 0) {
    html += '<li><span>아직 주문이 없습니다</span></li>';
  } else {
    Object.entries(totalMap).forEach(([menu, qty]) => {
      html += `<li><span>${escapeHtml(menu)}</span><b>${qty}</b></li>`;
    });
  }
  html += `</ul><p class="grand-total">총 ${totalCount}개</p><h2>인물별 주문</h2>`;

  const withOrders = cards.filter(c => Object.keys(c.orderMap).length > 0);
  if (withOrders.length === 0) {
    html += '<p style="color:#6b7280;font-size:13px;">주문이 배정된 카드가 없습니다</p>';
  } else {
    withOrders.forEach(c => {
      const avatarHtml = c.thumbSrc
        ? `<img class="mini-avatar" src="${c.thumbSrc}" alt="">`
        : `<div class="mini-avatar" style="display:flex;align-items:center;justify-content:center;">👤</div>`;
      html += `<div class="person-block"><div class="person-title">${avatarHtml}<span>${escapeHtml(cardLabelText(c))}</span></div><ul>`;
      Object.entries(c.orderMap).forEach(([menu, qty]) => {
        html += `<li><span>${escapeHtml(menu)}</span><span>x${qty}</span></li>`;
      });
      html += `</ul></div>`;
    });
  }

  statusContent.innerHTML = html;
  statusPanel.hidden = false;
  lastSummaryText = buildSummaryText(totalMap, totalCount);
}

function buildSummaryText(totalMap, totalCount) {
  const lines = ['[전체 합계]'];
  Object.entries(totalMap).forEach(([menu, qty]) => lines.push(`${menu} ${qty}`));
  lines.push(`총 ${totalCount}개`, '', '[인물별 주문]');
  cards.filter(c => Object.keys(c.orderMap).length > 0).forEach(c => {
    const items = Object.entries(c.orderMap).map(([m, q]) => `${m} x${q}`).join(', ');
    lines.push(`${cardLabelText(c)}: ${items}`);
  });
  return lines.join('\n');
}

document.getElementById('statusBtn').addEventListener('click', openStatusPanel);
document.getElementById('closeStatusBtn').addEventListener('click', () => statusPanel.hidden = true);
document.getElementById('closeStatusBtnTop').addEventListener('click', () => statusPanel.hidden = true);
document.getElementById('copyBtn').addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(lastSummaryText);
    toast('복사되었습니다');
  } catch (err) {
    alert(lastSummaryText);
  }
});

// ══════════════════════════════════════════
//  초기화 (주문만 초기화 / 전체 초기화)
// ══════════════════════════════════════════
document.getElementById('orderResetBtn').addEventListener('click', () => {
  if (!confirm('모든 주문 내역을 초기화할까요? (인물카드와 이름은 유지됩니다)')) return;
  cards.forEach(c => {
    c.orderMap = {};
    updateCardBadge(c);
  });
  if (selectedCardId !== null) {
    const card = cards.find(c => c.uid === selectedCardId);
    if (card) renderCardOrderList(card);
  }
  toast('주문 내역이 초기화되었습니다');
});

document.getElementById('resetBtn').addEventListener('click', () => {
  if (!confirm('사진, 인물카드, 주문 내역을 모두 초기화할까요?')) return;
  cards.forEach(c => c.el.remove());
  cards = [];
  cardCounter = 0;
  selectedCardId = null;
  menuImg.src = '';
  menuImg.hidden = true;
  resetImgZoom();
  stagePlaceholder.hidden = false;
  stage.style.paddingTop = '';
  stage.style.minHeight = '';
  hideCardPanel();
  micBtn.disabled = true;
  micLabel.textContent = '카드를 선택하세요';
});
</script>
